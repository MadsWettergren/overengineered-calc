openapi: 3.0.3
info:
  title: Over-engineered Calculator API
  description: >
    A small REST API for performing basic arithmetic and retrieving
    calculation history.
  version: "1.0.0"
servers:
  - url: http://localhost:8080
paths:
  /v1/calculations:
    post:
      summary: Perform a calculation and store it in history
      operationId: createCalculation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalculateRequest"
            examples:
              multiply:
                value:
                  operation: multiply
                  left: 6
                  right: 7
      responses:
        "201":
          description: Calculation performed and stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Calculation"
        "400":
          description: Malformed JSON, unknown fields, or unsupported operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid bearer token
        "422":
          description: Well-formed request that is not a valid calculation (e.g. division by zero)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: HTTP method not allowed on this path
    get:
      summary: List calculation history
      operationId: listCalculations
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All stored calculations, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Calculation"
        "405":
          description: HTTP method not allowed on this path
            /v1/auth/register:
    post:
      summary: Register a new account
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          description: Invalid email, weak password, or malformed JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/auth/login:
    post:
      summary: Log in and receive a bearer token
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /health/live:
    get:
      summary: Liveness probe
      operationId: healthLive
      responses:
        "200":
          description: The process is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Obtain a token from POST /v1/auth/login and pass it as
        `Authorization: Bearer <token>`.
  schemas:
    CalculateRequest:
      type: object
      required: [operation, left, right]
      additionalProperties: false
      properties:
        operation:
          type: string
          enum: [add, subtract, multiply, divide]
        left:
          type: number
          format: double
        right:
          type: number
          format: double
    RegisterRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    RegisterResponse:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    LoginResponse:
      type: object
      properties:
        token:
          type: string
    Calculation:
      type: object
      properties:
        id:
          type: string
        operation:
          type: string
          enum: [add, subtract, multiply, divide]
        left:
          type: number
          format: double
        right:
          type: number
          format: double
        result:
          type: number
          format: double
        created_at:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: division_by_zero
            message:
              type: string
              example: cannot divide by zero